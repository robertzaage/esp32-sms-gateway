# Example Home Assistant script for arbitrary SMS recipients without HACS.
# Replace sms-gateway/smsgw-xxxxxx with the gateway's configured base_topic.
script:
  send_sms_via_esp32_gateway:
    alias: Send SMS via ESP32 Gateway
    mode: queued
    fields:
      number:
        name: Recipient
        required: true
        selector:
          text:
      message:
        name: Message
        required: true
        selector:
          text:
            multiline: true
    sequence:
      - action: mqtt.publish
        data:
          topic: sms-gateway/smsgw-xxxxxx/sms/send
          qos: 1
          retain: false
          payload: >-
            {{ {
              "request_id": "ha-" ~ ((now().timestamp() * 1000000) | int),
              "to": number,
              "text": message,
              "delivery_report": true
            } | to_json }}
