name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vMAJOR.MINOR.PATCH tag to publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Resolve and validate release version
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid release tag: $TAG" >&2; exit 1; }
          git rev-parse --verify "refs/tags/$TAG" >/dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Validate contracts and host tests
        run: |
          python scripts/validate_contracts.py
          python -m unittest discover -s tests -v
          git diff --check
      - name: Install pinned ESP-IDF
        uses: espressif/install-esp-idf-action@v1
        with:
          version: "v6.0.2"
      - name: Build release firmware
        shell: bash
        env:
          GATEWAY_PROJECT_VER: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          idf.py set-target esp32s3
          idf.py build
          python scripts/inspect_app_image.py build/esp32_sms_gateway.bin \
            --expect-project esp32_sms_gateway --expect-version "$RELEASE_VERSION"
          mkdir -p dist
          OTA="esp32-sms-gateway-${RELEASE_TAG}-ota.bin"
          FACTORY="esp32-sms-gateway-${RELEASE_TAG}-factory.bin"
          cp build/esp32_sms_gateway.bin "dist/$OTA"
          idf.py merge-bin -o "$PWD/dist/$FACTORY" -f raw
          cp build/flash_args "dist/flash_args-${RELEASE_TAG}"
          python scripts/release_manifest.py \
            --dist dist --version "$RELEASE_VERSION" --ota "$OTA" --factory "$FACTORY" \
            --git-sha "$(git rev-parse HEAD)"
          (cd dist && sha256sum $(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort) > SHA256SUMS)
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --generate-notes --verify-tag
          fi
