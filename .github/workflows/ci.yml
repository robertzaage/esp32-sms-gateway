name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate contracts
        run: python scripts/validate_contracts.py
      - name: Run host tests
        run: python -m unittest discover -s tests -v

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned ESP-IDF
        uses: espressif/install-esp-idf-action@v1
        with:
          version: "v6.0.2"
      - name: Configure target
        run: idf.py set-target esp32s3
      - name: Build firmware
        run: idf.py build
      - name: Create merged factory image
        run: idf.py merge-bin -o esp32-sms-gateway-factory.bin -f raw
      - name: Assemble artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/esp32_sms_gateway.bin dist/esp32-sms-gateway-ota.bin
          cp build/esp32-sms-gateway-factory.bin dist/
          cp build/bootloader/bootloader.bin dist/
          cp build/partition_table/partition-table.bin dist/
          cp build/flash_args dist/
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: esp32-sms-gateway-firmware
          path: dist/
          if-no-files-found: error
